[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neuos-modern"
version = "0.1.0"
description = "Faithful Python port of the NeuOS (USENIX ATC'20) runtime coordination policy"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
torch = ["torch"]
http = ["requests"]
test = ["pytest"]

[tool.setuptools]
packages = ["neuos_modern", "neuos_modern.adapters"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
